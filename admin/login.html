<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Admin – Kesbangpol Kudus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../src/admin.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="admin-avatar">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h1>Login Admin</h1>
      <p>Kesbangpol Kabupaten Kudus</p>
    </div>

    <div class="card-body">
      <div class="error-msg" id="errorMsg">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span id="errorText">Username atau password salah.</span>
      </div>

      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <i class="bi bi-person-fill"></i>
          <input type="text" id="username" placeholder="Masukkan username" autocomplete="off">
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="bi bi-lock-fill"></i>
          <input type="password" id="password" placeholder="Masukkan password">
          <i class="bi bi-eye-fill toggle-pw" id="togglePw"></i>
        </div>
      </div>

      <button class="btn-login" onclick="doLogin()">
        <i class="bi bi-box-arrow-in-right"></i>
        Masuk ke Dashboard
      </button>

      <div class="back-link">
        <a href="../index.html"><i class="bi bi-arrow-left me-1"></i>Kembali ke halaman utama</a>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwyZ5WJGmg1qkPgjuiHGJrGzAIFNQWumpw92FBoun7S60oTYriJQ_6yxgcDFBBOqYdQ/exec";

    // Toggle password visibility
    document.getElementById("togglePw").addEventListener("click", function () {
      const pw = document.getElementById("password");
      const icon = this;
      if (pw.type === "password") {
        pw.type = "text";
        icon.classList.replace("bi-eye-fill", "bi-eye-slash-fill");
      } else {
        pw.type = "password";
        icon.classList.replace("bi-eye-slash-fill", "bi-eye-fill");
      }
    });

    // Enter key login
    document.addEventListener("keydown", function (e) {
      if (e.key === "Enter") doLogin();
    });

    async function doLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value; // ← tidak di-trim, spasi valid
      const errorMsg = document.getElementById("errorMsg");
      const errorText = document.getElementById("errorText");
      const btn = document.querySelector(".btn-login");

      if (!username || !password) {
        errorText.textContent = "Username dan password wajib diisi.";
        errorMsg.classList.add("show");
        return;
      }

      btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Memverifikasi...';
      btn.disabled = true;
      btn.classList.add("loading");
      errorMsg.classList.remove("show");

      try {
        // Pakai POST agar kredensial tidak muncul di URL/log
        const body = new URLSearchParams({ action: "login", username, password });
        const res = await fetch(APPS_SCRIPT_URL, { method: "POST", body });
        const data = await res.json();

        if (data.success) {
          sessionStorage.setItem("adminLoggedIn", "true");
          sessionStorage.setItem("adminUser", username);
          window.location.href = "dashboard.html";
        } else {
          errorText.textContent = "Username atau password salah.";
          errorMsg.classList.add("show");
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Masuk ke Dashboard';
          btn.disabled = false;
          btn.classList.remove("loading");
        }
      } catch (err) {
        errorText.textContent = "Gagal terhubung ke server. Coba lagi.";
        errorMsg.classList.add("show");
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Masuk ke Dashboard';
        btn.disabled = false;
        btn.classList.remove("loading");
      }
    }
  </script>

</body>
</html>
